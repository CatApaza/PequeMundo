<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Demostración académica de frames con frameset y frame en el proyecto PequeMundo."
    />
    <title>Demostración de frames | PequeMundo</title>
  <link rel="stylesheet" href="../css/estilos-sass.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23a7d8f0'/%3E%3Cpath d='M16 24s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 24 14c0 5.3-8 10-8 10z' fill='%2331566b'/%3E%3C/svg%3E" />
  </head>

  <!--
    EJEMPLO ACADÉMICO DE FRAMES
    La etiqueta <frameset> pertenece a HTML 4 y está obsoleta en HTML5.
    Se incluye únicamente porque forma parte del temario del curso.
    En un sitio real se reemplaza por iframes o por diseño responsivo.
  -->
  <frameset cols="30%,70%">
    <frame src="nosotros.html" name="marco-navegacion" title="Información de PequeMundo" />
    <frame src="catalogo.html" name="marco-contenido" title="Catálogo de productos" />

    <noframes>
      <body>
        <h1>Tu navegador no admite frames</h1>
        <p>
          Esta página es una demostración de <code>frameset</code>. Puedes
          continuar en el <a href="catalogo.html">catálogo</a> o volver a
          la <a href="../index.html">página de inicio</a>.
        </p>
      </body>
    </noframes>
  </frameset>
</html>
